name: Gerar capas dos PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.pdf'
      - '.github/workflows/pdf-covers.yml'

permissions:
  contents: write

concurrency:
  group: acervo2-pdf-covers
  cancel-in-progress: true

jobs:
  capas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade pymupdf pillow

      - name: Gerar catálogo, capas e páginas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json, re, unicodedata, fitz
          from PIL import Image

          root = Path('.')
          raw = 'https://raw.githubusercontent.com/jogoiarexx-blip/Manga-HQ-acervo-2/main/'

          def slug(text):
              s = unicodedata.normalize('NFKD', text).encode('ascii','ignore').decode('ascii').lower()
              return re.sub(r'[^a-z0-9]+','-',s).strip('-')

          TITLE_OVERRIDES = {
              '2-Superman O Legado das estrelas': 'Superman O Legado das Estrelas',
              '3-Superman Origem secreta': 'Superman Origem Secreta',
              '5-Superman As Quatro Estações': 'Superman As Quatro Estações',
              '6-Superman A Morte do Superman': 'Superman A Morte do Superman',
          }

          TITLE_OVERRIDES['7-Sucata Joe'] = 'Sucata Joe'

          def clean_title(folder):
              return TITLE_OVERRIDES.get(folder, re.sub(r'^\d+\s*-\s*','',folder).strip())

          def url_path(path):
              return '/'.join(quote(part, safe='') for part in Path(path).as_posix().split('/'))

          pdfs = sorted(root.glob('*/*.pdf'), key=lambda p: (p.parent.name.casefold(), int((re.search(r'-(\d+)\.pdf$', p.name, re.I) or ['','0'])[1])))
          grouped = {}

          for pdf in pdfs:
              folder = pdf.parent.name
              title = clean_title(folder)
              match = re.search(r'-(\d+)\.pdf$', pdf.name, re.I)
              if not match:
                  print('Ignorado sem número de edição:', pdf)
                  continue
              issue = int(match.group(1))
              cid = slug(title)
              cover = pdf.with_name(pdf.stem + '-cover.webp')

              doc = fitz.open(pdf)
              try:
                  page_count = doc.page_count
                  if not cover.exists() or cover.stat().st_mtime < pdf.stat().st_mtime:
                      page = doc.load_page(0)
                      pix = page.get_pixmap(matrix=fitz.Matrix(1.7,1.7), alpha=False)
                      image = Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
                      image.thumbnail((900,1400),Image.Resampling.LANCZOS)
                      image.save(cover,'WEBP',quality=84,method=6)
                      print('CAPA:', cover)
              finally:
                  doc.close()

              entry = {
                  'id': f'{cid}-{issue}',
                  'issue': issue,
                  'title': f'{title} #{issue}',
                  'format': 'pdf',
                  'file': raw + url_path(pdf),
                  'cover': raw + url_path(cover),
                  'size': pdf.stat().st_size,
                  'pageCount': page_count
              }
              grouped.setdefault(folder, {'id':cid,'title':title,'issues':[]})['issues'].append(entry)

          def folder_number(name):
              m = re.match(r'^(\d+)', name)
              return int(m.group(1)) if m else 999999

          collections = []
          flat = []
          for folder in sorted(grouped, key=lambda x:(folder_number(x),x.casefold())):
              col = grouped[folder]
              col['issues'].sort(key=lambda x:x['issue'])
              collections.append(col)
              flat.extend({**x,'collectionId':col['id'],'collectionTitle':col['title']} for x in col['issues'])

          catalog = {
              'schemaVersion': 1,
              'name': 'Manga HQ Acervo 2',
              'format': 'pdf',
              'supportedFormats': ['pdf'],
              'collections': collections,
              'items': flat,
              'itemCount': len(flat),
              'assetHost': 'raw.githubusercontent.com',
              'assetBase': raw
          }
          Path('catalogo.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PDFs catalogados:', len(flat))
          PY

      - name: Salvar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          find . -name '*-cover.webp' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualizar catálogo e capas dos PDFs"
            git pull --rebase origin main
            git push
          fi
