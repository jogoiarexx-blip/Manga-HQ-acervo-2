<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manga HQ Acervo 2</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101217;color:#eee;margin:0;padding:24px}
.wrap{max-width:1180px;margin:auto}
h1{margin:0 0 8px}.sub{color:#aab3c5;margin:0 0 22px}
.collection{margin:28px 0}.collection h2{font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{background:#1b1f29;border:1px solid #292f3d;border-radius:14px;overflow:hidden;min-width:0}
.cover{aspect-ratio:2/3;background:linear-gradient(145deg,#172033,#20283a);display:grid;place-items:center;overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{padding:18px;text-align:center;font-weight:800;color:#ccd4e4}
.card-body{padding:11px}.card b{display:block;line-height:1.3}.card small{display:block;color:#9da7b8;margin-top:6px}
.ok{color:#7ee787}.err{color:#ff7b72}
@media(max-width:520px){body{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:9px}.card b{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Manga HQ Acervo 2</h1>
  <p class="sub" id="s">Carregando catálogo…</p>
  <div id="collections"></div>
</div>
<script>
(async()=>{
  const status=document.getElementById('s');
  const host=document.getElementById('collections');
  try{
    const c=await fetch('./catalogo.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});
    status.innerHTML='<span class="ok">✓ catálogo OK</span> — '+c.itemCount+' edições';
    for(const col of (c.collections||[])){
      const section=document.createElement('section');section.className='collection';
      const h=document.createElement('h2');h.textContent=col.title+' — '+(col.issues||[]).length+' edições';section.append(h);
      const grid=document.createElement('div');grid.className='grid';
      for(const x of (col.issues||[])){
        const card=document.createElement('article');card.className='card';
        const cover=document.createElement('div');cover.className='cover';
        const img=document.createElement('img');img.loading='lazy';img.alt='Capa de '+x.title;img.src=x.cover||'';
        const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent=x.title;
        img.addEventListener('load',()=>fallback.remove());
        img.addEventListener('error',()=>img.remove());
        cover.append(img,fallback);
        const body=document.createElement('div');body.className='card-body';
        const title=document.createElement('b');title.textContent=x.title;
        const meta=document.createElement('small');meta.textContent=x.pageCount?x.pageCount+' páginas':'PDF';
        body.append(title,meta);card.append(cover,body);grid.append(card);
      }
      section.append(grid);host.append(section);
    }
  }catch(e){status.innerHTML='<span class="err">Erro: '+e.message+'</span>'}
})()
</script>
</body>
</html>
